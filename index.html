<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1D Football</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Saira:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Start screen -->
  <section id="start-screen" class="screen">
    <div id="bp-badge">
      <span id="bp-level">⭐ Lv 1</span>
      <div class="bp-bar"><div id="bp-fill"></div></div>
    </div>
    <h1>1D FOOTBALL</h1>
    <p id="player-title">RANK: ROOKIE</p>
    <div class="menu">
      <label>Mode
        <select id="mode-select">
          <option value="ai">1 Player vs AI</option>
          <option value="2p">2 Players</option>
        </select>
      </label>
      <label>Difficulty
        <select id="difficulty-select">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="extreme">🔥 EXTREME</option>
        </select>
      </label>
      <label>Points to win
        <select id="target-select">
          <option value="14">14</option>
          <option value="21" selected>21</option>
          <option value="28">28</option>
        </select>
      </label>
      <label>Home team
        <select id="home-team"></select>
      </label>
      <label>Away team
        <select id="away-team"></select>
      </label>
      <label>Ball
        <select id="ball-select"></select>
      </label>
      <label>Field
        <select id="field-select"></select>
      </label>
      <label>Conditions
        <select id="condition-select"></select>
      </label>
      <label class="checkbox">Coach voice
        <input type="checkbox" id="voice-toggle" checked />
      </label>
      <button id="start-btn">KICK OFF</button>
      <button id="bp-open-btn" class="secondary">BATTLE PASS</button>
    </div>
    <p class="controls-hint">
      Home: <kbd>A</kbd> &nbsp; Away: <kbd>L</kbd> &nbsp; Catch/Defend: <kbd>SPACE</kbd>
    </p>
  </section>

  <!-- Game screen -->
  <section id="game-screen" class="screen hidden">
    <div id="scoreboard">
      <span class="team home"><span id="label-home">HOME</span> <b id="score-home">0</b></span>
      <span id="game-status">1st &amp; 10</span>
      <span class="team away"><b id="score-away">0</b> <span id="label-away">AWAY</span></span>
    </div>
    <div id="target-line">First to —</div>

    <div id="field">
      <div class="endzone home-zone">
        <div class="goalpost"><span class="up left"></span><span class="up right"></span><span class="cross"></span><span class="pole"></span></div>
        <div class="logo" id="logo-home">🏈</div>
        <span class="zone-name" id="endzone-home">HOME</span>
      </div>
      <div id="gridiron">
        <div id="weather"></div>
        <div id="players"></div>
        <div id="ball">🏈</div>
        <div id="defenders"></div>
        <div id="firstdown-line"></div>
      </div>
      <div class="endzone away-zone">
        <div class="goalpost"><span class="up left"></span><span class="up right"></span><span class="cross"></span><span class="pole"></span></div>
        <div class="logo" id="logo-away">🏈</div>
        <span class="zone-name" id="endzone-away">AWAY</span>
      </div>
    </div>

    <div id="message"></div>

    <div id="playcall" class="hidden">
      <button data-play="rush">RUSH</button>
      <button data-play="pass">PASS</button>
      <button data-play="fieldgoal" class="fourth-only hidden">FIELD GOAL</button>
      <button data-play="punt" class="fourth-only hidden">PUNT</button>
    </div>

    <div id="kickoff-choice" class="hidden">
      <button data-kick="regular">REGULAR KICKOFF</button>
      <button data-kick="onside">ONSIDE KICK</button>
    </div>

    <div id="timing-bar" class="hidden">
      <div class="bar-track">
        <div class="sweet-zone"></div>
        <div class="bar-marker"></div>
      </div>
      <p class="timing-hint">Press your key in the green!</p>
    </div>
  </section>

  <!-- Battle pass screen -->
  <section id="bp-screen" class="screen hidden">
    <h1>Battle Pass</h1>
    <div id="bp-summary">⭐ Lv 1 — 0 / 250 XP</div>
    <div class="bp-bar big"><div id="bp-screen-fill"></div></div>
    <ul id="bp-tiers"></ul>
    <button id="bp-back-btn">Back</button>
  </section>

  <!-- Win screen -->
  <section id="win-screen" class="screen hidden">
    <h1 id="win-heading">Well Done!</h1>
    <p id="win-result"></p>
    <p id="win-xp"></p>
    <p id="win-unlock" class="hidden"></p>
    <div class="win-buttons">
      <button id="replay-btn">Play Again?</button>
      <button id="back-btn">Back!</button>
    </div>
  </section>

  <script type="module" src="src/game.js"></script>
</body>
</html>
